name: Run MATLAB Project

on:
  push:
  workflow_dispatch:

jobs:
  run-matlab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Run project
        uses: matlab-actions/run-command@v3
        with:
          command: run_all
